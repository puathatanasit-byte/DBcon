<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จองที่นั่งโรงอาหาร</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f4ef;--sf:#fff;--tx:#23201b;--mu:#6f695e;--bd:#e3ded2;--ac:#d9632b;--ok:#2f8f5b;--okb:#e4f4ea;--no:#b3392f;--nob:#fbe7e4;--me:#2b5fd9;--meb:#e5ecfc;--wn:#b9770e;--wnb:#fdf0d5}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171612;--sf:#221f1a;--tx:#f1ede4;--mu:#a49d8e;--bd:#38342b;--ac:#f08a52;--ok:#5fcf93;--okb:#173324;--no:#f08a80;--nob:#3a1f1c;--me:#8fb0ff;--meb:#1c2842;--wn:#f0b550;--wnb:#3a2d12}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Thai","Sarabun",system-ui,sans-serif;line-height:1.5}
.w{max-width:960px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:0}h2{font-size:1.05rem;margin:0 0 10px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.tabs{display:flex;gap:6px}
button,select,input{font:inherit;color:var(--tx)}
button{border:1px solid var(--bd);background:var(--sf);border-radius:10px;padding:8px 14px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button.on{background:var(--tx);color:var(--bg)}
button.d{color:var(--no);border-color:var(--no)}
select,input{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.clock{font-variant-numeric:tabular-nums;font-size:1.3rem;font-weight:700}
.st{padding:8px 12px;border-radius:10px;font-size:.92rem}
.st.ok{background:var(--okb);color:var(--ok)}.st.no{background:var(--nob);color:var(--no)}.st.wn{background:var(--wnb);color:var(--wn)}.st.me{background:var(--meb);color:var(--me)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.t{border:2px solid var(--bd);border-radius:14px;padding:12px;text-align:center;cursor:pointer;background:var(--sf);font-size:.9rem}
.t b{display:block;font-size:1.05rem}
.t.free{border-color:var(--ok);background:var(--okb)}.t.taken{border-color:var(--no);background:var(--nob)}.t.mine{border-color:var(--me);background:var(--meb)}
.seats{letter-spacing:2px}
.leg{display:flex;gap:12px;font-size:.85rem;color:var(--mu);flex-wrap:wrap;margin-bottom:10px}
.lt{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.ov{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.ov.s{display:flex}.md{background:var(--sf);border-radius:16px;padding:18px;max-width:420px;width:100%;max-height:85vh;overflow:auto}
.md h2{font-size:1.15rem}.sg{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--wn);color:#fff;padding:12px 18px;border-radius:12px;z-index:30;display:none;max-width:90%}
.hide{display:none}small,.mu{color:var(--mu)}
</style>
</head>
<body>
<div class="w">
<div class="top"><h1>🍽️ จองที่นั่งโรงอาหาร</h1>
<div class="tabs"><button id="bu" class="on">ผู้ใช้</button><button id="ba">แอดมิน</button></div></div>

<div class="card row" style="justify-content:space-between">
<div><small>เวลาในระบบ (จำลอง)</small><div class="clock" id="clk"></div></div>
<div class="row"><button id="p10">+10 นาที</button><button id="p30">+30 นาที</button><input type="time" id="stm"><button id="rst" class="d">รีเซ็ตข้อมูล</button></div>
</div>

<div id="user">
<div class="card"><div class="row"><label>ชั้นปี <select id="gr"></select></label><span id="win" class="st"></span></div></div>
<div id="mine"></div>
<div class="card"><h2>เลือกโต๊ะ</h2>
<div class="leg"><span>🟢 ว่าง</span><span>🔴 ถูกจองแล้ว</span><span>🔵 ของฉัน</span><button id="sim" style="padding:2px 10px">จำลอง: มีผู้ใช้อื่นจองโต๊ะ</button></div>
<div class="grid" id="grid"></div></div>
</div>

<div id="admin" class="hide">
<div class="card"><h2>ตั้งค่าเวลาเปิดจอง</h2>
<p class="mu" style="margin-top:0">ผู้ใช้จองได้ล่วงหน้าก่อนเวลาพักตามที่กำหนด และจองได้ถึงสิ้นสุดเวลาพัก (<b>60 นาที</b>)</p>
<div class="row" style="margin-bottom:12px"><label>เปิดจองล่วงหน้าก่อนพัก <input type="number" id="lead" min="0" max="240" style="width:80px"> นาที</label></div>
<div class="lt" id="lt"></div></div>
<div class="card"><h2>รายการจองทั้งหมด</h2><div id="all"></div></div>
</div>
</div>

<div class="ov" id="ov"><div class="md" id="md"></div></div>
<div class="toast" id="toast"></div>

<script>
var GR=["ม.1","ม.2","ม.3","ม.4","ม.5","ม.6"],DUR=60,KEY="canteen_v1";
var TB=[2,2,4,4,4,4,6,6,6,8,8,8].map(function(c,i){return{id:"T"+(i+1),cap:c}});
var S,mode=null,warned={},$=function(i){return document.getElementById(i)};
function def(){return{now:650,lead:15,start:[660,660,720,720,780,780],grade:0,
res:[{t:"T3",g:1,n:3,end:720,mine:false},{t:"T8",g:2,n:5,end:780,mine:false}]}}
function load(){try{var r=localStorage.getItem(KEY);S=r?JSON.parse(r):def()}catch(e){S=def()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function tm(m){m=Math.floor(m);var h=Math.floor(m/60)%24,x=m%60;return(h<10?"0":"")+h+":"+(x<10?"0":"")+x}
function parse(v){var a=v.split(":");return+a[0]*60+ +a[1]}
function resOf(t){return S.res.filter(function(r){return r.t===t})[0]}
function myRes(){return S.res.filter(function(r){return r.mine})[0]}
function win(g){var s=S.start[g];return{open:s-S.lead,start:s,end:s+DUR}}
function expire(){S.res=S.res.filter(function(r){return r.end>S.now})}
function show(h){$("md").innerHTML=h;$("ov").className="ov s"}
function hide(){$("ov").className="ov";mode=null;render()}
function toast(m){var t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none"},6000)}
function freeFor(n,ex){return TB.filter(function(t){return!resOf(t.id)&&t.cap>=n&&t.id!==ex}).sort(function(a,b){return a.cap-b.cap})}

function render(){
 expire();$("clk").textContent=tm(S.now);
 var g=S.grade,w=win(g),el=$("win");
 if(S.now<w.open){el.className="st wn";el.textContent="ยังไม่เปิดจอง — เปิดเวลา "+tm(w.open)+" (พักเที่ยง "+tm(w.start)+"–"+tm(w.end)+")"}
 else if(S.now>=w.end){el.className="st no";el.textContent="หมดเวลาพักของชั้นนี้แล้ว"}
 else{el.className="st ok";el.textContent="เปิดจองแล้ว • พัก "+tm(w.start)+"–"+tm(w.end)}
 var m=myRes(),mh="";
 if(m){var left=Math.ceil(m.end-S.now);
  mh='<div class="card st me"><b>การจองของฉัน:</b> โต๊ะ '+m.t+' • '+m.n+' คน • หมดเวลา '+tm(m.end)+' (เหลือ '+left+' นาที)<div class="row" style="margin-top:8px"><button id="chg">เปลี่ยนที่นั่ง</button><button class="d" id="cnl">ยกเลิกการจอง</button></div>'+(mode?'<br><b>เลือกโต๊ะใหม่ด้านล่าง</b> <button id="nochg">ยกเลิกการเปลี่ยน</button>':'')+'</div>';
  if(left<=5&&!warned[m.t+m.end]){warned[m.t+m.end]=1;toast("⏰ เหลือเวลาอีก "+left+" นาที โต๊ะ "+m.t+" จะหมดเวลาจอง")}}
 $("mine").innerHTML=mh;
 if(m){$("cnl").onclick=function(){S.res=S.res.filter(function(r){return!r.mine});save();toast("ยกเลิกการจองแล้ว โต๊ะถูกปล่อยว่าง");render()};
  $("chg").onclick=function(){mode="change";render()};if(mode)$("nochg").onclick=function(){mode=null;render()}}
 $("grid").innerHTML=TB.map(function(t){var r=resOf(t.id),c=r?(r.mine?"mine":"taken"):"free",
  l=r?(r.mine?"ของฉัน":"ถูกจองแล้ว"):"ว่าง";
  return'<div class="t '+c+'" data-t="'+t.id+'"><b>โต๊ะ '+t.id+'</b><span class="seats">'+"●".repeat(t.cap)+'</span><br>'+t.cap+' ที่นั่ง<br>'+l+(r?' ('+r.n+' คน)':'')+'</div>'}).join("");
 [].forEach.call(document.querySelectorAll(".t"),function(e){e.onclick=function(){pick(e.getAttribute("data-t"))}});
 var a="";S.res.sort(function(x,y){return x.t.localeCompare(y.t,"en",{numeric:true})}).forEach(function(r){
  a+='<div class="row" style="padding:6px 0;border-bottom:1px solid var(--bd);justify-content:space-between"><span>โต๊ะ '+r.t+' • '+GR[r.g]+' • '+r.n+' คน • ถึง '+tm(r.end)+(r.mine?' (ผู้ใช้นี้)':'')+'</span><button class="d" data-x="'+r.t+'">ปล่อยโต๊ะ</button></div>'});
 $("all").innerHTML=a||'<span class="mu">ยังไม่มีการจอง</span>';
 [].forEach.call(document.querySelectorAll("[data-x]"),function(b){b.onclick=function(){var t=b.getAttribute("data-x");S.res=S.res.filter(function(r){return r.t!==t});save();render()}})
}

function conflict(t,n){
 var f=freeFor(n,t).slice(0,4),h='<h2>⚠️ ที่นั่งนี้ถูกจองไว้แล้ว</h2><p>โต๊ะ '+t+' มีผู้ใช้อื่นมานั่งแล้วเป็นที่เรียบร้อย โปรดจองที่นั่งใหม่</p>';
 if(f.length){h+='<b>ที่นั่งที่ยังว่างและเหมาะกับ '+n+' คน:</b><div class="sg">'+f.map(function(x){return'<button class="p" data-s="'+x.id+'">โต๊ะ '+x.id+' ('+x.cap+' ที่)</button>'}).join("")+'</div>'}
 else h+='<p class="st no">ขณะนี้ไม่มีโต๊ะว่างที่รองรับ '+n+' คน</p>';
 show(h+'<button id="cl">ปิด</button>');$("cl").onclick=hide;
 [].forEach.call(document.querySelectorAll("[data-s]"),function(b){b.onclick=function(){confirm(b.getAttribute("data-s"),n)}})
}

function pick(t){
 var w=win(S.grade);
 if(S.now<w.open)return show('<h2>ยังไม่เปิดจอง</h2><p>ชั้น '+GR[S.grade]+' เปิดจองเวลา '+tm(w.open)+'</p><button id="cl">ตกลง</button>'),$("cl").onclick=hide;
 if(S.now>=w.end)return show('<h2>หมดเวลาจอง</h2><p>หมดเวลาพักของชั้นนี้แล้ว</p><button id="cl">ตกลง</button>'),$("cl").onclick=hide;
 var r=resOf(t),m=myRes();
 if(r&&r.mine)return;
 if(m&&!mode)return show('<h2>คุณมีการจองอยู่แล้ว</h2><p>ต้องการย้ายไปโต๊ะ '+t+'? กด “เปลี่ยนที่นั่ง” ในกล่องการจองของคุณก่อน</p><button id="cl">ตกลง</button>'),$("cl").onclick=hide;
 var tb=TB.filter(function(x){return x.id===t})[0],dn=m?m.n:1;
 if(r)return conflict(t,dn);
 var o="";for(var i=1;i<=tb.cap;i++)o+='<option'+(i===Math.min(dn,tb.cap)?" selected":"")+'>'+i+'</option>';
 show('<h2>จองโต๊ะ '+t+'</h2><p class="mu">โต๊ะนี้รองรับสูงสุด '+tb.cap+' คน</p><label>จำนวนคนที่จะนั่ง <select id="np">'+o+'</select></label><p>เวลาจองถึง '+tm(w.end)+'</p><div class="row"><button class="p" id="ok">ยืนยันการจอง</button><button id="cl">ยกเลิก</button></div>');
 $("cl").onclick=hide;$("ok").onclick=function(){confirm(t,+$("np").value)}
}

function confirm(t,n){
 expire();
 if(resOf(t))return conflict(t,n);
 var tb=TB.filter(function(x){return x.id===t})[0];
 if(n>tb.cap)return toast("โต๊ะนี้รองรับไม่เกิน "+tb.cap+" คน");
 S.res=S.res.filter(function(r){return!r.mine});
 S.res.push({t:t,g:S.grade,n:n,end:win(S.grade).end,mine:true});
 save();mode=null;$("ov").className="ov";
 toast(mode?"เปลี่ยนที่นั่งแล้ว":"จองโต๊ะ "+t+" สำเร็จ");render()
}

$("sim").onclick=function(){var f=freeFor(1).filter(function(t){return t.cap>=2});if(!f.length)return;
 var t=f[Math.floor(Math.random()*f.length)];S.res.push({t:t.id,g:S.grade,n:2,end:win(S.grade).end,mine:false});save();
 toast("ผู้ใช้อื่นเพิ่งจองโต๊ะ "+t.id);render()};
$("bu").onclick=function(){$("user").className="";$("admin").className="hide";$("bu").className="on";$("ba").className="";render()};
$("ba").onclick=function(){$("user").className="hide";$("admin").className="";$("ba").className="on";$("bu").className="";render()};
$("p10").onclick=function(){S.now+=10;save();render()};
$("p30").onclick=function(){S.now+=30;save();render()};
$("stm").onchange=function(){if(this.value){S.now=parse(this.value);save();render()}};
$("rst").onclick=function(){S=def();warned={};save();init();render()};
$("gr").onchange=function(){S.grade=+this.value;save();render()};
$("lead").onchange=function(){S.lead=Math.max(0,+this.value||0);save();render()};

function init(){
 $("gr").innerHTML=GR.map(function(g,i){return'<option value="'+i+'"'+(i===S.grade?" selected":"")+'>'+g+'</option>'}).join("");
 $("lead").value=S.lead;$("stm").value=tm(S.now);
 $("lt").innerHTML=GR.map(function(g,i){return'<b>'+g+'</b><label>เริ่มพัก <input type="time" data-g="'+i+'" value="'+tm(S.start[i])+'"> <small>(พักถึง '+tm(S.start[i]+DUR)+')</small></label>'}).join("");
 [].forEach.call(document.querySelectorAll("[data-g]"),function(e){e.onchange=function(){if(e.value){S.start[+e.getAttribute("data-g")]=parse(e.value);save();init();render()}}})
}
load();init();render();
setInterval(function(){S.now+=1/60;if(Math.floor(S.now*60)%15===0)save();render()},1000);
</script>
</body>
</html>
